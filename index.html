<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>シフト管理</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <button id="printBtn" class="print-btn">印刷</button>
        <button id="restoreBtn" class="print-btn restore-btn-header">復元</button>
        <button id="themeToggleBtn" class="print-btn theme-btn">ナイトモード</button>

        <h1>シフト管理</h1>
        <button id="addPersonBtn" class="add-btn">＋</button>
    </header>

    <!-- 名前入力ポップアップ -->
    <div id="nameModal" class="modal">
        <div class="modal-content">
            <h3>名前を入力してください</h3>
            <input type="text" id="modalNameInput" placeholder="名前">
            <button id="modalOkBtn">OK</button>
            <button id="modalCancelBtn">キャンセル</button>
        </div>
    </div>

    <!-- 追加された人を入れる場所 -->
    <div id="personContainer"></div>

    <!-- 削除確認モーダル -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <p style="font-size: 24px; margin-bottom: 20px;">削除しますか？</p>
            <button id="deleteOkBtn">はい</button>
            <button id="deleteCancelBtn">いいえ</button>
        </div>
    </div>

    <!-- 復元モーダル -->
    <div id="restoreModal" class="modal">
        <div class="modal-content">
            <p style="font-size: 28px; margin-bottom: 20px;">データ復元</p>
            <button id="copyDataBtn" class="restore-btn">コピー</button>
            <button id="pasteDataBtn" class="restore-btn">貼り付け</button>
            <button id="restoreCancelBtn" class="restore-cancel-btn">閉じる</button>
        </div>
    </div>
</body>
</html>
