<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>シフト管理</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>シフト管理</h1>
        <button id="addPersonBtn" class="add-btn">追加</button>
    </header>

    <!-- 名前入力ポップアップ -->
    <div id="nameModal" class="modal">
        <div class="modal-content">
            <h3>名前を入力してください</h3>
            <input type="text" id="modalNameInput" placeholder="名前">
            <button id="modalOkBtn">OK</button>
            <button id="modalCancelBtn">キャンセル</button>
        </div>
    </div>

    <!-- 最初の1人分 -->
    <div class="individual">


        <div class="top-row">
            <input type="text" class="name-input" placeholder="名前">
            <button class="delete-btn">削除</button>
        </div>

        <table class="shift-table">
            <tr>
                <th>月</th>
                <th>火</th>
                <th>水</th>
                <th>木</th>
                <th>金</th>
                <th>土</th>
                <th>日</th>
            </tr>
            <tr>
                <td><select><option>〇</option><option>✕</option><option>ー</option></select></td>
                <td><select><option>〇</option><option>✕</option><option>ー</option></select></td>
                <td><select><option>〇</option><option>✕</option><option>ー</option></select></td>
                <td><select><option>〇</option><option>✕</option><option>ー</option></select></td>
                <td><select><option>〇</option><option>✕</option><option>ー</option></select></td>
                <td><select><option>〇</option><option>✕</option><option>ー</option></select></td>
                <td><select><option>〇</option><option>✕</option><option>ー</option></select></td>
            </tr>
        </table>
    </div>
    <!-- 追加された人を入れる場所 -->
    <div id="personContainer"></div>

</body>
</html>
