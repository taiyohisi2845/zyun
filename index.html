<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>シフト管理</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>

<body>
  <header class="site-header" role="banner">
    <div class="header-left header-actions">
      <button id="printBtn" class="btn print-btn" type="button" aria-label="印刷">印刷</button>
      <button id="restoreBtn" class="btn restore-open-btn" type="button" aria-haspopup="dialog" aria-controls="restoreModal" aria-label="復元">復元</button>
    </div>

    <h1 class="site-title">シフト管理</h1>

    <div class="header-right header-add">
      <button id="addPersonBtn" class="btn add-btn" type="button" aria-haspopup="dialog" aria-controls="nameModal" aria-label="追加">追加</button>
    </div>
  </header>

  <main id="main" role="main">
    <!-- 名前入力モーダル -->
    <div id="nameModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="nameModalTitle" hidden>
      <div class="modal-content" role="document">
        <h2 id="nameModalTitle">名前を入力してください</h2>
        <label for="modalNameInput" class="visually-hidden">名前</label>
        <input id="modalNameInput" name="personName" type="text" placeholder="名前" autocomplete="name" />
        <div class="modal-actions">
          <button id="modalOkBtn" class="btn" type="button">OK</button>
          <button id="modalCancelBtn" class="btn" type="button">キャンセル</button>
        </div>
      </div>
    </div>

    <!-- 削除確認モーダル -->
    <div id="deleteModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle" hidden>
      <div class="modal-content" role="document">
        <h2 id="deleteModalTitle">削除しますか</h2>
        <p class="modal-message">この人を削除してもよろしいですか？</p>
        <div class="modal-actions">
          <button id="deleteOkBtn" class="btn danger" type="button">はい</button>
          <button id="deleteCancelBtn" class="btn" type="button">いいえ</button>
        </div>
      </div>
    </div>

    <!-- 復元モーダル -->
    <div id="restoreModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="restoreModalTitle" hidden>
      <div class="modal-content" role="document">
        <h2 id="restoreModalTitle">データ復元</h2>
        <p class="modal-message">保存済みデータのコピーや貼り付けを行います</p>
        <div class="modal-actions">
          <button id="copyDataBtn" class="btn restore-btn" type="button">コピー</button>
          <button id="pasteDataBtn" class="btn restore-btn" type="button">貼り付け</button>
          <button id="restoreCancelBtn" class="btn restore-cancel-btn" type="button">閉じる</button>
        </div>
      </div>
    </div>

    <!-- 登録者一覧セクション -->
    <section id="personSection" aria-labelledby="personSectionTitle">
      <h2 id="personSectionTitle" class="visually-hidden">登録者一覧</h2>
      <div id="personContainer" class="person-container" aria-live="polite"></div>
    </section>
  </main>

  <!-- 視覚的に隠すユーティリティ（CSSで定義してください） -->

    .visually-hidden {
